<div class="citation">
  {% if entry.author %}
    <p>{{ entry.author }}</p>
  {% endif %}

  {% if entry.title %}
    <p>{{ entry.title }}</p>
  {% endif %}

  {% if entry.booktitle %}
    <p>{{ entry.booktitle }}</p>
  {% endif %}

  {% if entry.year %}
    <p>{{ entry.year }}</p>
  {% endif %}

  {% if entry.note %}
    <p>{{ entry.note }}</p>
  {% endif %}
</div>

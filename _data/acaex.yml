- Role: Tutor
  Class: "CMPS6620: Artificial Intelligence"
  id: CMPS6620-Artificial-Intelligence
  data-id: data-tutor1-tulane
  heading-id: head-tutor1-Tulane
  StartDate: 08/2025
  EndDate: 12/2025
  first: true    # one must be true to properly display
  description: >
    As a tutor for CMPS 6620: Artificial Intelligence, a graduate-level course taught 
    by Professor Aron Culotta, my role was to support M.S. and Ph.D. students as they 
    developed both theoretical and practical foundations in AI. The course focused on the 
    design and analysis of autonomous intelligent agents, combining formal algorithmic 
    reasoning with implementation-driven assignments. I held weekly online office hours 
    where I worked one-on-one with students to clarify core concepts such as uninformed 
    and heuristic search, adversarial search, Bayesian networks, decision networks, Markov 
    Decision Processes, and reinforcement learning. Much of my support centered on helping 
    students reason through algorithm design choices, analyze correctness and complexity, 
    and translate mathematical formulations into working implementations for programming 
    assignments. I also provided targeted guidance on long-form assignments and exam preparation, 
    helping students connect lecture material, textbook readings, and their own code. This role 
    required communicating complex ideas clearly to a diverse group of graduate students and 
    reinforcing rigorous problem-solving habits expected in an advanced AI curriculum. 

- Role: Teaching Assistant
  Class: "CMPS1600: Introduction to Computer Science II"
  id: CMPS1600-Introduction-to-Computer-Science-II
  data-id: data-ta2-tulane
  heading-id: head-ta2-tulane
  StartDate: 01/2025
  EndDate: 05/2025
  first: false   # one must be true to properly display
  description: >
    As a teaching assistant for CMPS 1600: Introduction to Computer Science II, the second course 
    in Tulane’s introductory computer science sequence taught by Professor Alireza Shirvani, I 
    supported undergraduate students as they learned structured software design and data-structure–based 
    thinking. I led weekly recitation sessions for two sections totaling approximately 60 students, 
    where recitations were run as hands-on lab periods focused on weekly programming assignments. 
    During these sessions, I helped students debug code, review implementations, reason about memory 
    management and pointers, and analyze time complexity while reinforcing core object-oriented concepts 
    such as inheritance, abstraction, and interfaces. I also held weekly office hours providing 
    individualized support on assignments, exams, and the semester-long class project, where students 
    built simple games using Professor Shirvani’s Camelot virtual environment. The project was 
    structured around graphs, with nodes representing story states and edges representing player choices, 
    and I assisted students with implementing this structure in Java, integrating it with the Camelot API, 
    and testing their projects end to end. In addition to instructional support, I proctored the midterm 
    exam. I also developed supplementary practice problems and review materials to reinforce lecture 
    content and common implementation issues. 


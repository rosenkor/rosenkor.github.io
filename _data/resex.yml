  first: true
  description: >
    Since August 2024, I have served as a Research Assistant at Tulane University under the guidance of Dr. Aron Culotta,
    conducting research focused on machine learning and natural language processing. My first research project focused on
    developing deep learning models to analyze administrative datasets and predict procedural outcomes across sequences
    of criminal court proceedings. I built the entire pipeline from the ground up, including data preprocessing, record
    linkage, feature engineering, label extraction from unstructured text, model development, evaluation, and model
    interpretability. This work resulted in my first first-author paper, From Arraignment to Resolution: Transformer Models
    of Court Cases, recently accepted to Findings of EMNLP 2026. I am currently beginning a new research project focused
    broadly on model behavior, interpretability, and machine learning methods for analyzing complex real-world data.


- University: University of North Texas
  Role: Undergraduate Research Assistant
  id: compsci
  data-id: data-research2 
  heading-id: head-research2
  StartDate: 05/2022
  EndDate: 08/2024
  first: false
  description: >
    During my time as a Research Assistant at the University of North Texas, 
    I immersed myself in a deep learning project under the guidance of Professor Ting Xiao and 
    Dr. Daniel Lersch. My involvement originated from the Research Experience for Undergraduates (REU) program, 
    focusing on the application of variational autoencoders for particle identification within the realm of high-energy 
    physics. As part of the research team, I contributed to the collaborative design and implementation of the models.
    My individual contributions included building an automated hyperparameter tuning pipeline that reduced model selection 
    time from days to hours, developing an analytics system for learning-curve analysis, anomaly detection, and latent-space 
    evaluation with real-time monitoring, and implementing custom optimization routines to automate model assessment and 
    selection. I presented this work as a poster at the REU symposium, where we reported empirical results and 
    discussed methodological limitations and future directions. Beyond the REU, there was an opportunity to extend this research
    into a longer-term project. Over the subsequent time, I continued to refine and expand upon our initial findings,
    that lead to significant progress in model performance.  
    

- University: Purdue University
  Role: Political Science Undergraduate Research Assistant
  id: polsci
  data-id: data-research1
  heading-id: head-research1
  StartDate: 06/2023
  EndDate: 01/2024
  first: false   # one must be true to properly display
  description: >
    In the summer of 2023, as a Research Assistant at Purdue University under Professors Daniel Schiff 
    and Kaylyn Jackson Schiff, I embarked on an exploratory project to harness the potential of Large 
    Language Models (LLMs) for the analysis of sociopolitical behavior from a demographic perspective. 
    My role entailed a thorough examination of LLM architectures to enhance their precision 
    in identifying demographic-specific linguistic patterns. I crafted innovative prompts that 
    married linguistic insights with AI technology, aiming to draw out nuanced information from 
    varied demographic segments. Analyzing the predictive accuracy of LLMs in pinpointing distinctive 
    phrases within open-ended survey responses, I applied advanced natural language processing techniques 
    to large datasets to uncover the complex relationship between language usage and demographic factors. 
    This multifaceted project not only honed my technical and analytical acumen but also deepened my understanding 
    of the ethical dimensions of synthetic data generation. The experience solidified my resolve to advocate for AI's 
    responsible use, recognizing its power and the necessity of thoughtful application.

